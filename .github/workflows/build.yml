name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: |
          uvx ruff format --check
          uvx ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Configure git for copier
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Install
        run: uv sync --all-packages
      - name: Unit tests
        run: uv run pytest --cov=copier_ui --cov=copier_tui -v ./tests/unit

  functional:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Configure git for copier
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Build both packages
        run: |
          uv build --package copier-ui --out-dir packages/copier-ui/dist
          uv build --package copier-tui --out-dir packages/copier-tui/dist
      - name: Install wheels into a throwaway environment
        run: |
          uv venv --python 3.13 tmp/functional-venv
          uv pip install --python tmp/functional-venv \
            packages/copier-ui/dist/*.whl packages/copier-tui/dist/*.whl \
            pytest pytest-asyncio jinja2-time
      - name: Functional tests against the built wheels
        run: tmp/functional-venv/bin/pytest -v ./tests/functional
      - name: Check distributions
        run: |
          uv run twine check packages/copier-ui/dist/* packages/copier-tui/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist/*
