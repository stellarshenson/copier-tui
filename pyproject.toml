# Virtual workspace root - not a distributable package.
# The two published packages live in packages/copier-ui and packages/copier-tui.

[tool.uv.workspace]
members = ["packages/copier-ui", "packages/copier-tui"]

[tool.uv.sources]
copier-ui = { workspace = true }

[dependency-groups]
dev = [
    "build",
    # copier-data-science, the reference template used by the tests, eagerly loads
    # jinja2_time.TimeExtension - a template's own extensions must be importable
    "jinja2-time",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 99
src = ["packages/copier-ui/src", "packages/copier-tui/src"]
include = ["pyproject.toml", "packages/*/src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["copier_ui", "copier_tui"]
force-sort-within-sections = true
