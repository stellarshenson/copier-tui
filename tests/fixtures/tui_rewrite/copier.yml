_subdirectory: template

# every default below the first answer is computed from an answer above it, so changing that
# answer rewrites a control the cursor is not on
tls:
    type: bool
    default: false

port:
    type: int
    default: "{% if tls %}8443{% else %}80{% endif %}"

name:
    type: str
    default: ab

api_key:
    type: str
    secret: true
    default: "{{ name }}-key"
